
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">

    <title>FORENZA | Drone Live Feed</title>

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- LUCIDE ICONS -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- DASHBOARD CSS -->
    <link rel="stylesheet" href="./dashboard.css">

</head>

<body>

    <!-- BACKGROUND TEXTURE -->
    <div class="texture"></div>

    <div class="dashboard-layout">

        <!-- =====================================
             SIDEBAR
        ====================================== -->

        <aside class="sidebar">

            <!-- FORENZA BRANDING -->
            <div class="sidebar-brand">

                <div class="sidebar-drone">

                    <svg viewBox="0 0 120 100" fill="none"
                         xmlns="http://www.w3.org/2000/svg">

                        <g stroke="currentColor"
                           stroke-width="3"
                           stroke-linecap="round">

                            <path d="M49 43L25 22"/>
                            <path d="M71 43L95 22"/>
                            <path d="M49 57L25 78"/>
                            <path d="M71 57L95 78"/>

                        </g>

                        <g stroke="currentColor" stroke-width="2">

                            <ellipse cx="19" cy="16" rx="15" ry="5"/>
                            <ellipse cx="101" cy="16" rx="15" ry="5"/>
                            <ellipse cx="19" cy="84" rx="15" ry="5"/>
                            <ellipse cx="101" cy="84" rx="15" ry="5"/>

                        </g>

                        <path d="M42 37L52 30H68L78 37L83 50L78 63L68 70H52L42 63L37 50Z"
                              fill="#211B14"
                              stroke="currentColor"
                              stroke-width="2"/>

                        <circle cx="60" cy="50" r="5"
                                fill="#080808"
                                stroke="currentColor"
                                stroke-width="2"/>

                    </svg>

                </div>

                <span class="brand-name">FORENZA</span>

                <span class="brand-subtitle">
                    FORENSIC INTELLIGENCE
                </span>

            </div>


            <!-- ANIMATED FORENSIC DIVIDER -->

            <div class="sidebar-divider forensic-divider"></div>


            <!-- NAVIGATION -->

            <nav class="sidebar-navigation">

                <p class="nav-heading">WORKSPACE</p>


                <!-- CASES -->

                <a href="cases.html" class="nav-item">

                    <i data-lucide="folder-open" class="nav-icon"></i>

                    <span>Cases</span>

                </a>


                <!-- DASHBOARD -->

                <a href="dashboard.html" class="nav-item">

                    <i data-lucide="house" class="nav-icon"></i>

                    <span>Dashboard</span>

                </a>


                <!-- DRONE LIVE FEED -->

                <a href="drone.html" class="nav-item active">

                    <i data-lucide="drone" class="nav-icon"></i>

                    <span>Drone Live Feed</span>

                    <span class="live-indicator"
                          title="Live drone feed"></span>

                </a>


                <!-- EVIDENCE -->

                <a href="evidence.html" class="nav-item">

                    <i data-lucide="file-text" class="nav-icon"></i>

                    <span>Evidence</span>

                </a>


                <!-- AI SUMMARY -->

                <a href="processing.html" class="nav-item">

                    <i data-lucide="monitor" class="nav-icon"></i>

                    <span>AI Summary</span>

                </a>

            </nav>


            <!-- SIGN OUT -->

            <div class="sidebar-footer">

                <a href="#" class="logout-link">

                    <i data-lucide="log-out" class="nav-icon"></i>

                    <span>Sign out</span>

                </a>

            </div>

        </aside>


        <!-- =====================================
             MAIN CONTENT
        ====================================== -->

        <main class="main-content">

            <!-- TOP BAR -->

            <header class="topbar">

                <div class="breadcrumb">

                    <span>FORENZA</span>

                    <span class="breadcrumb-divider">/</span>

                    <span class="current-page">Drone Live Feed</span>

                </div>

            </header>


            <!-- DRONE WORKSPACE -->

            <div class="content-wrapper">

                <section class="drone-section">

                    <!-- PAGE HEADING -->

                    <div class="drone-heading">

                        <p class="section-eyebrow">
                            AERIAL SURVEILLANCE
                        </p>

                        <h1>
                            <span id="typing-title"></span><span class="typing-cursor"></span>
                        </h1>

                    </div>


                    <!-- EMPTY CAMERA CONTAINER -->

                    <div class="drone-feed-panel">

                        <div class="drone-screen">

                            <!-- FORENSIC GRID -->

                            <div class="screen-grid"></div>


                            <!-- CORNER MARKERS -->

                            <div class="screen-corner corner-top-left"></div>

                            <div class="screen-corner corner-top-right"></div>

                            <div class="screen-corner corner-bottom-left"></div>

                            <div class="screen-corner corner-bottom-right"></div>

                        </div>

                    </div>

                </section>

            </div>

        </main>

    </div>


    <!-- =====================================
         DRONE PAGE STYLING
    ====================================== -->

    <style>

        /* =====================================
           MAIN WORKSPACE
        ====================================== */

        .content-wrapper {

            width: 100%;
            max-width: 1800px;

            margin: 0 auto;

            min-height: calc(100vh - 76px);
            height: calc(100vh - 76px);

            padding: 45px 45px 0;

            display: flex;
            flex-direction: column;

            box-sizing: border-box;

        }

        .drone-section {

            width: 100%;

            display: flex;
            flex-direction: column;

            flex: 1;
            min-height: 0;

        }


        /* =====================================
           DRONE HEADING
        ====================================== */

        .drone-heading {

            margin-bottom: 25px;
            flex-shrink: 0;

        }

        .drone-heading .section-eyebrow {

            margin-bottom: 12px;

            color: var(--bronze-light);

            font-family: "DM Mono", monospace;
            font-size: 10px;
            letter-spacing: 2px;

        }

        .drone-heading h1 {

            display: flex;
            align-items: center;

            min-height: 65px;

            color: var(--gold);

            font-size: clamp(42px, 5vw, 64px);

            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1.1;

        }


        /* =====================================
           TYPING ANIMATION
        ====================================== */

        .typing-cursor {

            display: inline-block;

            width: 3px;
            height: 48px;

            margin-left: 8px;

            background: var(--bronze-light);

            animation: cursorBlink 0.8s steps(2) infinite;

        }

        @keyframes cursorBlink {

            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }

        }


        /* =====================================
           CAMERA FEED CONTAINER
        ====================================== */

        .drone-feed-panel {

            position: relative;

            width: 100%;

            flex: 1;
            min-height: 450px;

            background: #000000;

            border: 1px solid var(--border);
            border-radius: 6px;

            overflow: hidden;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.4),
                inset 0 0 35px rgba(168, 117, 61, 0.025);

            transition: border-color 0.3s ease;

        }

        .drone-feed-panel:hover {

            border-color: var(--bronze-light);

        }


        /* =====================================
           CAMERA SCREEN
        ====================================== */

        .drone-screen {

            position: relative;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(168, 117, 61, 0.055),
                    transparent 65%
                ),
                #000000;

        }


        /* =====================================
           FORENSIC GRID
        ====================================== */

        .screen-grid {

            position: absolute;
            inset: 0;

            pointer-events: none;

            background-image:

                linear-gradient(
                    rgba(168, 117, 61, 0.035) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(168, 117, 61, 0.035) 1px,
                    transparent 1px
                );

            background-size: 40px 40px;

        }


        /* =====================================
           CAMERA CORNER MARKERS
        ====================================== */

        .screen-corner {

            position: absolute;

            width: 35px;
            height: 35px;

            border-color: var(--bronze-light);
            border-style: solid;

            opacity: 0.75;

        }

        .corner-top-left {

            top: 20px;
            left: 20px;

            border-width: 2px 0 0 2px;

        }

        .corner-top-right {

            top: 20px;
            right: 20px;

            border-width: 2px 2px 0 0;

        }

        .corner-bottom-left {

            bottom: 20px;
            left: 20px;

            border-width: 0 0 2px 2px;

        }

        .corner-bottom-right {

            bottom: 20px;
            right: 20px;

            border-width: 0 2px 2px 0;

        }


        /* =====================================
           RESPONSIVE TABLET
        ====================================== */

        @media (max-width: 1100px) {

            .content-wrapper {

                padding: 40px 25px 0;

            }

            .drone-heading h1 {

                font-size: clamp(38px, 5vw, 54px);

            }

        }


        /* =====================================
           RESPONSIVE MOBILE
        ====================================== */

        @media (max-width: 700px) {

            .content-wrapper {

                height: auto;
                min-height: calc(100vh - 76px);

                padding: 35px 18px 18px;

            }

            .drone-section {

                min-height: calc(100vh - 130px);

            }

            .drone-heading {

                margin-bottom: 22px;

            }

            .drone-heading h1 {

                font-size: clamp(29px, 7vw, 40px);
                min-height: 45px;

            }

            .typing-cursor {

                height: 32px;
                width: 2px;

            }

            .drone-feed-panel {

                flex: 1;
                min-height: 300px;

            }

        }


        /* =====================================
           REDUCED MOTION
        ====================================== */

        @media (prefers-reduced-motion: reduce) {

            .live-indicator,
            .forensic-divider,
            .forensic-divider::after,
            .typing-cursor {

                animation: none !important;

            }

            .forensic-divider {

                width: 180px;
                opacity: 1;

            }

        }

    </style>


    <!-- =====================================
         LUCIDE ICON INITIALISATION
    ====================================== -->

    <script>

        lucide.createIcons();

    </script>


    <!-- =====================================
         TYPING EFFECT
    ====================================== -->

    <script>

        const title = "LIVE CAMERA FEED";

        const typingElement = document.getElementById("typing-title");

        let characterIndex = 0;

        function typeTitle() {

            if (characterIndex < title.length) {

                typingElement.textContent += title.charAt(characterIndex);

                characterIndex++;

                setTimeout(typeTitle, 90);

            }

        }

        window.addEventListener("load", () => {

            setTimeout(typeTitle, 500);

        });

    </script>


    <!-- =====================================
         FIREBASE AUTHENTICATION
    ====================================== -->

    <script type="module">

        import {
            auth,
            onAuthStateChanged,
            signOut
        } from "./firebase.js";


        // CHECK INVESTIGATOR LOGIN

        onAuthStateChanged(auth, (user) => {

            if (!user) {

                window.location.replace("login.html");

            } else {

                console.log("FORENZA: Drone workspace authenticated.");

            }

        });


        // SIGN OUT

        const logoutLink = document.querySelector(".logout-link");

        if (logoutLink) {

            logoutLink.addEventListener("click", async (event) => {

                event.preventDefault();

                try {

                    await signOut(auth);

                    window.location.replace("login.html");

                } catch (error) {

                    console.error("FORENZA sign-out error:", error);

                    alert("Unable to sign out. Please try again.");

                }

            });

        }

    </script>

</body>
</html>
